name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter create . --project-name glitch_camera_app --org com.pashasard --platforms android

      - name: Add permissions
        run: |
          sed -i 's|<uses-permission android:name="android.permission.CAMERA"/>|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>|' android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk to 36
        run: |
          sed -i -E 's|^([[:space:]]*)compileSdk[[:space:]]*=.*$|\1compileSdk = 36|g' android/app/build.gradle.kts
          sed -i -E 's|compileSdkVersion [0-9]+|compileSdkVersion 36|g' android/app/build.gradle 2>/dev/null || true

      - name: Force compileSdk 36 in all plugin dependencies
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/build.gradle.kts")
          s = p.read_text()
          block = '''subprojects {
              afterEvaluate {
                  val androidExt = extensions.findByName("android")
                  if (androidExt != null) {
                      for (methodName in listOf("compileSdkVersion", "setCompileSdkVersion")) {
                          try {
                              androidExt.javaClass
                                  .getMethod(methodName, Int::class.javaPrimitiveType)
                                  .invoke(androidExt, 36)
                              break
                          } catch (e: NoSuchMethodException) {
                              // пробуем следующее имя метода
                          } catch (e: Exception) {
                              println("compileSdk override failed for ${project.name}: ${e.message}")
                              break
                          }
                      }
                  }
              }
          }
          '''
          idx = s.find("subprojects {")
          if idx == -1:
              s = s + "\n" + block
          else:
              s = s[:idx] + block + "\n" + s[idx:]
          p.write_text(s)
          PY

      - name: Show compileSdk after
        run: |
          grep -n "compileSdk" android/app/build.gradle.kts || true
          echo "----- android/build.gradle.kts -----"
          cat android/build.gradle.kts

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Find APK
        run: find build -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-camera-apk
          path: build/app/outputs/**/*.apk

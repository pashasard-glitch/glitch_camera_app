name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter create . --project-name glitch_camera_app --org com.pashasard --platforms android

      - name: Add permissions
        run: |
          sed -i 's|<uses-permission android:name="android.permission.CAMERA"/>|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>|' android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk to 36
        run: |
          sed -i -E 's|^([[:space:]]*)compileSdk[[:space:]]*=.*$|\1compileSdk = 36|g' android/app/build.gradle.kts

      - name: Show compileSdk after
        run: grep -n "compileSdk" android/app/build.gradle.kts || true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Find APK
        run: find build -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-camera-apk
          path: build/app/outputs/**/*.apk

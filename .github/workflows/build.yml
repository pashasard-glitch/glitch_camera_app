name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter create . --project-name glitch_camera_app --org com.pashasard --platforms android

      - name: Add permissions to manifest
        run: |
          sed -i 's|<uses-permission android:name="android.permission.CAMERA"/>|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>|' android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk to 34
        run: |
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk[ =]*[0-9]*/compileSdk = 34/g' {} \;
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' {} \;
          grep -r "compileSdk" android/app/ || true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release 2>&1 | tail -150

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-camera-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter create . --project-name glitch_camera_app --org com.pashasard --platforms android

      - name: Add permissions
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-feature android:name="android.hardware.camera" android:required="true"/>' android/app/src/main/AndroidManifest.xml
          echo "--- Manifest after insert ---"
          cat android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk to 36
        run: |
          sed -i -E 's|^([[:space:]]*)compileSdk[[:space:]]*=.*$|\1compileSdk = 36|g' android/app/build.gradle.kts

      - name: Add Maven Central as fallback plugin repository
        run: |
          sed -i '/pluginManagement {/a\    repositories {\n        gradlePluginPortal()\n        google()\n        mavenCentral()\n    }' android/settings.gradle.kts || true
          echo "--- settings.gradle.kts after ---"
          cat android/settings.gradle.kts

      - name: Redirect ffmpeg-kit to maintained fork
        run: |
          sed -i '/allprojects {/a\    configurations.all {\n        resolutionStrategy.dependencySubstitution {\n            substitute(module("com.arthenica:ffmpeg-kit-https")).using(module("dev.ffmpegkit-maintained:ffmpeg-kit-https:6.0.3"))\n        }\n    }' android/build.gradle.kts

      - name: Show compileSdk after
        run: grep -n "compileSdk" android/app/build.gradle.kts || true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Find APK
        run: find build -name "*.apk" -type f

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-camera-apk
          path: build/app/outputs/**/*.apk

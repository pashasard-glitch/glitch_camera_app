name: glitch_camera_app
description: A glitch camera app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  path_provider: ^2.1.4
  gal: ^2.3.0
  permission_handler: ^11.3.1
  sensors_plus: ^6.0.1
  flutter_quick_video_encoder: ^1.2.5
  record: ^5.1.2
  ffmpeg_kit_flutter: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/glitch.frag

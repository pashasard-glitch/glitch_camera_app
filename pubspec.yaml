name: glitch_camera_app
description: A glitch camera app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  panorama_image: ^0.0.1
  path_provider: ^2.1.4
  video_player: ^2.9.2
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  gal: ^2.3.0
  permission_handler: ^11.3.1
  sensors_plus: ^6.0.1
  flutter_quick_video_encoder: ^1.7.2
  record: ^5.2.1
  ffmpeg_kit_flutter_new_video: ^2.4.3
  model_viewer_plus: ^1.7.0
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/glitch.frag

dependency_overrides:
  record_linux: ^1.3.0
